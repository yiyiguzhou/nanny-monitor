server:
  port: 8080

spring:
  application:
    name: nanny-monitor
  datasource:
    url: jdbc:mysql://192.168.1.38:3306/auto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.example.nanny.domain
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:test-api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-vl-plus
          temperature: 0.1
          max-tokens: 512

nanny:
  frame:
    interval-seconds: 5
  alert:
    window-size: 6
    abnormal-threshold: 2
    caregiver-absent-threshold: 3
    low-confidence-threshold: 0.55
    cooldown-seconds: 300
  clip:
    buffer-max-frames: 450
    buffer-max-age-seconds: 30
    duration-seconds: 30
    fps: 15

dubbo:
  application:
    name: nanny-monitor
  protocol:
    name: dubbo
    port: -1
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://192.168.1.38:8848}
    username: nacos
    password: nacos
  provider:
    version: 1.0.0
    group: HSF

jwt:
  secret: ${JWT_SECRET:nanny-monitor-secret-key-must-be-at-least-256-bits-long}
  expiration: 86400000

payment:
  wechat:
    merchant-id: ${WECHAT_MERCHANT_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
    notify-url: ${WECHAT_NOTIFY_URL:}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:}

subscription:
  monthly-price: 29.9
  quarterly-price: 79.9
  yearly-price: 299.0

logging:
  level:
    com.example.nanny: INFO