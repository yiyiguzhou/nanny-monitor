server:
  port: 8080

spring:
  application:
    name: nanny-monitor
  datasource:
    url: jdbc:h2:file:./data/nanny-monitor;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

nanny:
  frame:
    interval-seconds: 5
  vlm:
    # 通义千问-VL OpenAI-compatible endpoint
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-vl-plus
    timeout-seconds: 45
  alert:
    window-size: 6
    abnormal-threshold: 2
    caregiver-absent-threshold: 3
    low-confidence-threshold: 0.55
    cooldown-seconds: 300

logging:
  level:
    com.example.nanny: INFO
