server:
  port: 8080

spring:
  application:
    name: nanny-monitor
  datasource:
    url: jdbc:mysql://192.168.1.38:3306/auto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-vl-plus
          temperature: 0.1
          max-tokens: 512

nanny:
  frame:
    interval-seconds: 5
  alert:
    window-size: 6
    abnormal-threshold: 2
    caregiver-absent-threshold: 3
    low-confidence-threshold: 0.55
    cooldown-seconds: 300

logging:
  level:
    com.example.nanny: INFO
